name: Document Studio Urdu Font Export Audit

on:
  push:
    branches:
      - fix/document-studio-urdu-font-cascade-20261012
  workflow_dispatch:

jobs:
  verify-font-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit font identity in real PDF and Word downloads
        run: npx playwright test tests/e2e/documentStudioFontExports.spec.ts --project=desktop-chrome --workers=1 --reporter=github
      - name: Upload screenshots, PDF and DOCX inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urdu-font-export-audit
          path: test-results/font-export-audit/
          if-no-files-found: warn
          retention-days: 5
