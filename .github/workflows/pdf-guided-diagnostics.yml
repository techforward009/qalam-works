name: PDF Guided Diagnostics Acceptance (No Deployment)
on:
  push:
    branches: [feature/pdf-guided-export-diagnostics]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Unit and structural diagnostic tests
        run: npx vitest run tests/pdfExportDiagnostics.test.ts --reporter=verbose
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Existing PDF regression and Chromium font tests
        shell: bash
        run: |
          export QALAM_PDF_CHROMIUM="$(node --input-type=module -e 'import chromium from "@sparticuz/chromium"; process.stdout.write(await chromium.executablePath())')"
          mapfile -t pdf_specs < <(find tests -type f \( -iname '*pdf*.test.ts' -o -iname '*pdf*.test.tsx' \))
          npx vitest run "${pdf_specs[@]}" --reporter=verbose
      - name: Build
        run: npm run build
      - name: Launch local production build for UI acceptance
        run: |
          (npm run start -- -H 127.0.0.1 > /tmp/pdf-guided-server.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/tools/document-studio -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pdf-guided-server.log
          exit 1
      - name: Chromium UI diagnostic, navigation, screenshot, retry
        run: node scripts/pdf-guided-ui-acceptance.cjs
      - name: Upload synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-guided-diagnostics-ui
          path: artifacts/pdf-guided-ui/
          if-no-files-found: warn
      - name: Verify clean diff
        run: |
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD
