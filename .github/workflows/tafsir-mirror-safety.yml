name: Tafsir Independent Mirror Safety — No Deployment
on:
  push:
    branches: [hotfix/tafsir-independent-mirror-20261016]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mirror-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tafsir mirror auth and safety (no live blob)
        run: npx vitest run tests/tafsirMirror.test.ts tests/tafsirR2Worker.test.ts tests/tafsirShardsR2.test.ts tests/quranReaderUiFixes.test.ts
      - name: Ask Books R2 backend, source integrity and UI safety
        run: npx vitest run tests/knowledgeR2Backend.test.ts tests/knowledgeR2AskRoute.test.ts tests/knowledgeParentsKafi.test.ts tests/knowledgeQualityParents.test.ts tests/knowledgePrecisionDisplay.test.ts tests/knowledgeDigitalKhattSource.test.tsx tests/knowledgeQuranParentPriority.test.ts tests/knowledgeLongSourceUi.test.tsx tests/bookLibraryPublicOnly.test.tsx tests/research/failClosed.test.tsx
      - name: TypeScript
        run: npx tsc --noEmit
