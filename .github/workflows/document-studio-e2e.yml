name: Document Studio E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/tools/document-studio/**'
      - 'app/api/export-pdf/**'
      - 'tests/document*.test.ts*'
      - 'tests/e2e/documentStudio*.spec.ts'
      - 'playwright.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - '.github/workflows/document-studio-e2e.yml'
  push:
    branches:
      - document-studio-v2-images
      - document-studio-v2-page-sections
      - document-studio-v2-image-wrapping

jobs:
  document-studio-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # One Playwright invocation per project: each starts its own fresh
      # webServer, so the per-instance PDF export rate limiter is not shared
      # between the desktop and mobile runs.
      - run: npx playwright test tests/e2e/documentStudio.spec.ts tests/e2e/documentStudioUrduTableCells.spec.ts --project=desktop-chrome --workers=1 --reporter=github
      - run: npx playwright test tests/e2e/documentStudio.spec.ts tests/e2e/documentStudioUrduTableCells.spec.ts --project=mobile-android --workers=1 --reporter=github
      - run: npx vitest run tests/documentImages.test.ts tests/documentPageSections.test.ts tests/documentTables.test.ts tests/documentStudioSchemaAttrs.test.ts tests/documentStudioShell.test.ts tests/buildDocxDocument.test.ts tests/documentCommands.test.ts tests/documentStudioMultilingual.test.ts tests/pdfRealPipeline.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check
      - name: Run repository suite with an explicit main-baseline comparison
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Fail closed: the baseline must be the exact PR base (or origin/main on push).
          if [ -n "${PR_BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            base_sha="$PR_BASE_SHA"
          else
            git fetch --no-tags --depth=1 origin main
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          baseline_dir="$RUNNER_TEMP/qalam-main-baseline"
          trap 'git worktree remove --force "$baseline_dir" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$baseline_dir" "$base_sha"
          test "$(git -C "$baseline_dir" rev-parse HEAD)" = "$base_sha"
          echo "Baseline: $base_sha in $baseline_dir; branch: $(git rev-parse HEAD) in $PWD"

          set +e
          npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/branch-vitest.json" 2>&1 | tee "$RUNNER_TEMP/branch-npm-test.log"
          branch_status=${PIPESTATUS[0]}
          set -e
          if [ "$branch_status" -eq 0 ]; then
            echo "Branch repository suite passed."
            exit 0
          fi

          (
            cd "$baseline_dir"
            test "$(git rev-parse HEAD)" = "$base_sha"
            npm ci
            set +e
            npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/main-vitest.json"
            exit 0
          ) 2>&1 | tee "$RUNNER_TEMP/main-npm-test.log"
          test -s "$RUNNER_TEMP/branch-vitest.json"
          test -s "$RUNNER_TEMP/main-vitest.json"

          # Exits 1 on any failure identity present on the branch but not on the base.
          node scripts/ci/compare-vitest-failures.mjs \
            "$RUNNER_TEMP/branch-vitest.json" "$PWD" \
            "$RUNNER_TEMP/main-vitest.json" "$baseline_dir"
          echo "::warning::Repository suite has only unchanged base ($base_sha) failures."
