name: Khateeb Book Reader R1 (No Deployment)

on:
  pull_request:
    paths:
      - 'app/lib/knowledge/bookReaderModel.ts'
      - 'app/lib/knowledge/bookReaderProgress.ts'
      - 'app/api/research/book-reader/route.ts'
      - 'app/tools/khateeb-studio/BookReader.tsx'
      - 'app/tools/khateeb-studio/KhateebStudioContent.tsx'
      - 'app/tools/khateeb-studio/BookLibraryPanel.tsx'
      - 'app/tools/khateeb-studio/CustomSermonWorkspace.tsx'
      - 'app/tools/khateeb-studio/library/**'
      - 'tests/bookReaderModel.test.ts'
      - 'tests/bookReaderProgress.test.ts'
      - 'tests/khateebBookReaderRoute.test.ts'
      - 'tests/khateebBookReaderUI.test.tsx'
      - 'tests/khateebBookLibraryUI.test.tsx'
      - 'tests/khateebBookReaderEntry.test.ts'
      - 'tests/bookReaderTranslationCopy.test.ts'
      - '.github/workflows/khateeb-book-reader-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-reader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused reader and sermon integration tests
        run: npx vitest run tests/bookReaderModel.test.ts tests/bookReaderProgress.test.ts tests/khateebBookReaderRoute.test.ts tests/khateebBookReaderUI.test.tsx tests/khateebBookReaderEntry.test.ts tests/bookReaderTranslationCopy.test.ts tests/khateebBookLibraryUI.test.tsx
      - name: Typecheck (repo-wide, for integration)
        run: npx tsc --noEmit --pretty false
