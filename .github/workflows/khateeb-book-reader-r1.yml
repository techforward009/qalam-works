name: Khateeb Book Reader R1 (No Deployment)

on:
  pull_request:
    paths:
      - 'app/lib/knowledge/bookReaderModel.ts'
      - 'app/lib/knowledge/bookReaderPagination.ts'
      - 'app/lib/knowledge/bookReaderProgress.ts'
      - 'app/api/research/book-reader/route.ts'
      - 'app/tools/khateeb-studio/BookReader.tsx'
      - 'app/tools/khateeb-studio/BookReader.module.css'
      - 'app/globals.css'
      - 'app/tools/khateeb-studio/KhateebStudioContent.tsx'
      - 'app/tools/khateeb-studio/BookLibraryPanel.tsx'
      - 'app/tools/khateeb-studio/CustomSermonWorkspace.tsx'
      - 'app/tools/khateeb-studio/library/**'
      - 'tests/bookReaderModel.test.ts'
      - 'tests/bookReaderPagination.test.ts'
      - 'tests/bookReaderProgress.test.ts'
      - 'tests/khateebBookReaderRoute.test.ts'
      - 'tests/khateebBookReaderUI.test.tsx'
      - 'tests/khateebBookLibraryUI.test.tsx'
      - 'tests/e2e/khateebBookLibrary.spec.ts'
      - 'tests/khateebBookReaderEntry.test.ts'
      - 'tests/bookReaderTranslationCopy.test.ts'
      - '.github/workflows/khateeb-book-reader-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-reader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused reader and sermon integration tests
        run: npx vitest run tests/bookReaderModel.test.ts tests/bookReaderPagination.test.ts tests/bookReaderProgress.test.ts tests/khateebBookReaderRoute.test.ts tests/khateebBookReaderUI.test.tsx tests/khateebBookReaderEntry.test.ts tests/bookReaderTranslationCopy.test.ts tests/khateebBookLibraryUI.test.tsx
      - name: Typecheck (repo-wide, for integration)
        run: npx tsc --noEmit --pretty false
      - name: Install Chromium for local fixture screenshots
        run: npx playwright install --with-deps chromium
      - name: Start local reader fixture server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/qalam-reader-dev.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/tools/khateeb-studio/library > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qalam-reader-dev.log
          exit 1
      - name: Run local fixture reader visuals
        run: npx playwright test tests/e2e/khateebBookLibrary.spec.ts --project=desktop-chrome
      - name: Upload local fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-reader-visual-fixtures-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
