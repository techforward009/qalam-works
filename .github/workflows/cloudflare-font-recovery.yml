name: Cloudflare Font Recovery Safety (No Deployment)
on:
  push:
    branches: [hotfix/fonts-cloudflare-worker-20261016]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  font-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test original font serving and license gates
        run: npx vitest run tests/cloudflareFontRecovery.test.ts tests/publicBlobFontCatalog.test.ts tests/jameelBlobAuth.test.ts tests/pdfFontReady.test.ts tests/fontRegistry.test.ts tests/quranReader.test.ts tests/cloudflareFontSourceRoutes.test.ts
      - name: TypeScript safety
        run: npx tsc --noEmit
  live-font-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and validate exact ten original WOFF2 assets from live Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          root="https://qalam-fonts-private-mirror.techforward009.workers.dev/fonts"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          while read -r sha name bytes; do
            echo "Validating original $name ($bytes bytes)"
            curl --fail --show-error --silent --location --max-time 60 --retry 2 \
              -D "$work/headers" -o "$work/$name" "$root/$name"
            grep -qiE '^content-type: *font/woff2' "$work/headers"
            grep -qiE '^access-control-allow-origin: *\\*' "$work/headers"
            test "$(stat -c '%s' "$work/$name")" -eq "$bytes"
            test "$(head -c 4 "$work/$name" | od -An -tx1 | tr -d ' \\n')" = "774f4632"
            (cd "$work" && printf '%s  %s\n' "$sha" "$name" | sha256sum --check --status)
            echo "PASS $name"
          done <<'FONT_SHA256'
            ddcce6d3bd7dd026f6a0035040e71da3ddac669a470336459dc08045a43dd7fe muhammadi-quranic-400.woff2 220136
            d12978f4398f1f788d65fa7ccb872cf0e1c43aef89166816243e94487d9cee27 jameel-noori-nastaleeq-400.woff2 5554728
            7e83325ff08842b011d6d70060ea055a992318e1cc5997bd66ccf1e13e35aac0 NafeesNastaleeq.woff2 129624
            3b2219947cbd4704b4534198005f8e3818182ded24cac774c1fa0f625a955f82 NafeesNastaleeq-Web.woff2 23692
            0e60d92fbf7a86dad972b7e75dfbb85dd94ffe3ee8fbba0c14115fc977efb466 Alvi_Nastaleeq.woff2 5228460
            cf6b33bd971d65eef3eedafcae62ee8e88bdfe30ef6a23f9ab627a2f24e376d6 Gulzar-Regular.woff2 237008
            25e4a066c637948e01e12b7c8bf9e13afa188fad6949affedc6ddf2d307b31b0 Sahel.woff2 35460
            67c5c24a178e7e3e1c1c6ca7095448e70da6f882bf7f41783a8085e7ba87269e ScheherazadeNew-Medium.woff2 147916
            2e9bfe82c0e631244e5729408fee76778b04edc716bed9da054c7c286de6f368 BNazanin.woff2 20076
            c9e108d6c962ef2f18b7b939f7a5ebf74ce65192a85249cb571554c18f3e9ab8 AlFars9Badr.woff2 30340
          FONT_SHA256
          echo "All ten Cloudflare-delivered original fonts passed SHA-256, size, WOFF2, CORS, and MIME verification."
