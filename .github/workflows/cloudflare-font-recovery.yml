name: Cloudflare Font Recovery Safety (No Deployment)
on:
  push:
    branches: [hotfix/fonts-cloudflare-worker-20261016]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  font-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test original font serving and license gates
        run: npx vitest run tests/cloudflareFontRecovery.test.ts tests/publicBlobFontCatalog.test.ts tests/jameelBlobAuth.test.ts tests/pdfFontReady.test.ts tests/fontRegistry.test.ts tests/quranReader.test.ts
      - name: TypeScript safety
        run: npx tsc --noEmit
