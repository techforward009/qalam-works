name: Khateeb Sermon Validation
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - khateeb-sermon-local-validation
  workflow_dispatch:
jobs:
  sermon-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/sermonComposer.test.ts tests/sermonReview.test.ts
      - run: npx tsc --noEmit
      - run: npm run test:sermon:flow:imports
      - run: git diff --check

  sermon-live:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run grounded sermon live verification'
    needs: sermon-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QALAM_SERMON_PROVIDER: ${{ vars.QALAM_SERMON_PROVIDER }}
      QALAM_SERMON_REVIEW_PROVIDER: ${{ vars.QALAM_SERMON_REVIEW_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify prerequisites without printing credentials
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_AUTH_TOKEN" ]; then
            echo "::error::Live test unavailable: private research credentials have not been configured in GitHub Actions."
            exit 1
          fi
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Live test unavailable: no sermon model credentials configured in GitHub Actions."
            exit 1
          fi
      - run: npm run test:sermon:flow:live
