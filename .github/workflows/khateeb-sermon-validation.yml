name: Khateeb Sermon Validation
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - khateeb-sermon-local-validation
  workflow_dispatch:
jobs:
  sermon-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/sermonComposer.test.ts tests/sermonReview.test.ts
      - run: npx tsc --noEmit
      - run: npm run test:sermon:flow:imports
      - run: git diff --check
