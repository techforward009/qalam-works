name: Khateeb Ghaflah Source and Duration Acceptance
on:
  push:
    branches: [feature/khateeb-ghaflah-reader-r2-20261017]
  pull_request:
    paths:
      - 'app/tools/khateeb-studio/**'
      - '.github/workflows/khateeb-ghaflah-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Focused Ghaflah source, series and duration tests
        run: npx vitest run app/tools/khateeb-studio/engine/__tests__/ghaflahFreshMajalis.test.ts app/tools/khateeb-studio/engine/__tests__/ghaflahPackage.test.ts tests/khateebStudio.test.ts --reporter=verbose
      - name: Verify type safety
        run: npx tsc --noEmit
