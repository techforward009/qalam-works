name: Blob Transfer Containment — Read-only CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [hotfix/blob-transfer-containment-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Blob access isolation, library, and corpus regressions
        run: npx vitest run tests/research/durableBlob.test.ts tests/khateebBookLibraryRoute.test.ts tests/bookCorpusUpload.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Whitespace and diff checks
        run: git diff --check
