name: Muse evidence probe (offline)

on:
  pull_request:
    paths:
      - 'scripts/evaluate-muse-wonder.mjs'
      - '.github/workflows/muse-evidence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check scripts/evaluate-muse-wonder.mjs
      - name: Run all offline fixtures and mutation checks
        run: node scripts/evaluate-muse-wonder.mjs --self-test
